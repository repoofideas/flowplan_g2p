[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowplan-g2p"
version = "1.0.0"
description = "Graph-Based Paragraph Planning for Structured Patent Description Generation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "FlowPlan-G2P Team", email = "contact@flowplan-g2p.org" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
keywords = ["patent", "nlp", "graph", "text-generation", "scientific-papers"]
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "json5>=0.9.6",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.26.137"]
eval = ["bert-score>=0.3.13", "rouge-score>=0.1.2"]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/repoofideas/flowplan_g2p"
Repository = "https://github.com/repoofideas/flowplan_g2p.git"
Documentation = "https://github.com/repoofideas/flowplan_g2p#readme"
"Bug Tracker" = "https://github.com/repoofideas/flowplan_g2p/issues"

[project.scripts]
flowplan-g2p = "flowplan_g2p.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["flowplan_g2p"]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["flowplan_g2p"]
omit = ["tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]